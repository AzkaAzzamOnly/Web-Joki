<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <radialGradient id="genshin-glow" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1B162B" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#111822" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0B0E14" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="mystic-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2D9F3"/>
      <stop offset="50%" stop-color="#C7B8E5"/>
      <stop offset="100%" stop-color="#7B68A6"/>
    </linearGradient>
    <linearGradient id="teal-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4E9CAE"/>
      <stop offset="100%" stop-color="#75B8C9"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="800" fill="#0B0E14"/>
  <rect width="1200" height="800" fill="url(#genshin-glow)"/>

  <!-- Starry Constellation Mesh -->
  <g opacity="0.25" stroke="#C7B8E5" stroke-width="1">
    <line x1="200" y1="150" x2="350" y2="280"/>
    <line x1="350" y1="280" x2="480" y2="190"/>
    <line x1="480" y1="190" x2="600" y2="250"/>
    <line x1="600" y1="250" x2="720" y2="170"/>
    <line x1="720" y1="170" x2="880" y2="260"/>
    <line x1="880" y1="260" x2="1020" y2="140"/>
  </g>
  <g fill="#F3F4F6">
    <circle cx="200" cy="150" r="3"/>
    <circle cx="350" cy="280" r="4"/>
    <circle cx="480" cy="190" r="3"/>
    <circle cx="600" cy="250" r="5" fill="#75B8C9"/>
    <circle cx="720" cy="170" r="3"/>
    <circle cx="880" cy="260" r="4"/>
    <circle cx="1020" cy="140" r="3"/>
  </g>

  <!-- Celestial Astrolabe / Vision Frame -->
  <g transform="translate(600, 360)">
    <!-- Outer concentric astrolabe rings -->
    <circle cx="0" cy="0" r="220" fill="none" stroke="#C7B8E5" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.4"/>
    <circle cx="0" cy="0" r="180" fill="#131520" stroke="#75B8C9" stroke-width="2" opacity="0.7"/>
    <circle cx="0" cy="0" r="140" fill="none" stroke="#C7B8E5" stroke-width="2"/>
    
    <!-- Quad-Star Primogem / Fate Emblem -->
    <path d="M0,-120 C15,-40 40,-15 120,0 C40,15 15,40 0,120 C-15,40 -40,15 -120,0 C-40,-15 -15,-40 0,-120 Z" fill="url(#mystic-grad)" opacity="0.95"/>
    <circle cx="0" cy="0" r="28" fill="#0B0E14" stroke="#75B8C9" stroke-width="3"/>
    <circle cx="0" cy="0" r="12" fill="#75B8C9"/>
    
    <!-- Orbiting Glyphs -->
    <polygon points="0,-160 8,-145 -8,-145" fill="#C7B8E5"/>
    <polygon points="160,0 145,8 145,-8" fill="#C7B8E5"/>
    <polygon points="0,160 8,145 -8,145" fill="#C7B8E5"/>
    <polygon points="-160,0 -145,8 -145,-8" fill="#C7B8E5"/>
  </g>

  <!-- Title & Subtitle -->
  <text x="600" y="620" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="28" fill="#F3F4F6" letter-spacing="6">GENSHIN IMPACT</text>
  <text x="600" y="655" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#C7B8E5" letter-spacing="3">100% REGION EXPLORATION • ARCHON QUEST & RESIN SERVICE</text>
</svg>
